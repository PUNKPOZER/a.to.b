<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>a.to.b</title>
<meta name="description" content="a.to.b — DJ selection, set building and transition planning. Local-first audio analysis.">
<meta name="theme-color" content="#060606">
<meta name="author" content="punk pozer">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="ui/atob.css">
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <span id="logoSlot" aria-label="a.to.b"></span>
    <nav class="nav" id="mainNav" aria-label="Main">
      <button data-tab="analyze" class="active" data-i18n="nav.analyze">Analyze</button>
      <button data-tab="library" data-i18n="nav.library">Library</button>
      <button data-tab="setbuilder" data-i18n="nav.setbuilder">Set Builder</button>
      <button data-tab="sets" data-i18n="nav.sets">Sets</button>
      <button data-tab="explore" data-i18n="nav.explore">Explore</button>
    </nav>
    <div class="header-right">
      <button class="chip-status" id="backendPill" data-i18n-title="status.openSettings"><i class="dot" id="backendDot"></i><span class="txt" id="backendText">Local only</span></button>
      <button class="langbtn" id="langBtn" aria-label="Language"><b>EN</b> / RU</button>
      <button class="iconbtn" id="settingsBtn" data-i18n-aria="nav.settings" data-i18n-title="nav.settings"></button>
    </div>
  </header>

  <main class="main" id="main">
    <div id="analyzeProgress" class="hidden" role="status"></div>
    <div id="view" class="view"></div>
  </main>

  <footer class="player" id="playerBar" aria-label="Player">
    <div class="pl-track"><span id="pbArt"></span><div style="min-width:0"><div class="t1" id="pbTitle"></div><div class="t2" id="pbArtist"></div></div></div>
    <div class="pl-center">
      <div class="transport">
        <button class="iconbtn" id="pbShuffle" aria-pressed="false" data-i18n-aria="player.shuffle"></button>
        <button class="iconbtn" id="pbPrev" data-i18n-aria="player.prev"></button>
        <button class="playbtn" id="pbPlay" data-i18n-aria="player.play"></button>
        <button class="iconbtn" id="pbNext" data-i18n-aria="player.next"></button>
        <button class="iconbtn" id="pbRepeat" aria-pressed="false" data-i18n-aria="player.repeat"></button>
      </div>
      <div class="tl"><span class="mono" id="pbCur">0:00</span><canvas class="wave row" id="pbWave" aria-label="Timeline"></canvas><span class="mono" id="pbDur">0:00</span></div>
    </div>
    <div class="pl-right"><span class="dim" id="pbVolIcon"></span><input class="vol" id="pbVol" type="range" min="0" max="1" step="0.01" value="0.9" data-i18n-aria="player.volume"><button class="iconbtn" id="pbQueue" data-i18n-aria="player.queue"></button><button class="iconbtn" id="pbClose" data-i18n-aria="player.close"></button></div>
  </footer>
</div>
<input type="file" id="fileInput" accept=".mp3,.wav,.aiff,.aif,.flac,.m4a,audio/*" multiple hidden />
<input type="file" id="folderInput" webkitdirectory directory multiple hidden />
<div id="drawerRoot"></div>
<div id="menuRoot"></div>
<div id="modalRoot"></div>
<div id="dialogRoot"></div>
<div id="onboardRoot"></div>
<div id="tipRoot"></div>
<div id="toastRoot"></div>

<!-- audio modules (pure / worker clients) -->
<script src="audio/analysis-fusion.js"></script>
<script src="audio/essentia-client.js"></script>
<script src="audio/waveform.js"></script>
<script src="audio/audio-store.js"></script>
<script src="audio/backend-client.js"></script>
<script src="audio/sonic-similarity.js"></script>
<script src="audio/calibration.js"></script>
<script src="audio/dj-engine.js"></script>
<script src="audio/grid.js"></script>
<script src="audio/local-grid.js"></script>
<script src="audio/transition.js"></script>
<script src="audio/set-tools.js"></script>
<script src="audio/export.js"></script>
<script src="audio/genre-rank.js"></script>
<script src="audio/id3.js"></script>
<script src="ui/logo.js"></script>
<script src="app/i18n-en.js"></script>
<script src="app/i18n-ru.js"></script>
<script src="app/i18n.js"></script>
<script src="ui/primitives.js"></script>
<script src="app/shims.js"></script>
<!-- engine + app -->
<script src="engine/core.js"></script>
<script src="app/state.js"></script>
<script src="app/pipeline.js"></script>
<script src="app/backend.js"></script>
<script src="app/grids.js"></script>
<script src="app/player.js"></script>
<script src="app/actions.js"></script>
<!-- views -->
<script src="ui/analyze.js"></script>
<script src="ui/library.js"></script>
<script src="ui/setbuilder.js"></script>
<script src="ui/transition-guide.js"></script>
<script src="ui/export-dialog.js"></script>
<script src="ui/sets-settings.js"></script>
<script src="ui/onboarding.js"></script>
<script src="app/init.js"></script>
</body>
</html>
